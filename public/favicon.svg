<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Nitro Ignition Amber Gradient -->
    <linearGradient id="nitroGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Metallic Shield Stroke -->
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container / Hex Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#shieldStroke)" stroke-width="1.5" />

  <!-- Aerodynamic Racing Apex / S-F Monogram Chevron -->
  <g filter="url(#neonGlow)">
    <!-- Outer Wing Left (S shape slant) -->
    <path d="M15 22 L27 12 L33 17 L23 25 L35 34 L31 43 L17 33 Z" fill="url(#cyanGrad)" />
    
    <!-- Outer Wing Right (F shape slant) -->
    <path d="M49 42 L37 52 L31 47 L41 39 L29 30 L33 21 L47 31 Z" fill="url(#cyanGrad)" />

    <!-- Center Apex Turbine Blade / Arrow -->
    <polygon points="32,18 42,28 32,38 22,28" fill="#ffffff" opacity="0.95" />
    
    <!-- Nitro Spark Center Diamond -->
    <polygon points="32,24 37,28 32,32 27,28" fill="url(#nitroGrad)" />

    <!-- Speed Dash Lines -->
    <line x1="12" y1="48" x2="22" y2="48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="42" y1="16" x2="52" y2="16" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
